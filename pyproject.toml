[project]
name = "safebite"
version = "0.1.0"
description = "SafeBite food-label screening capstone project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "google-genai==3.0.0",
    "langfuse==5.1.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "streamlit[auth]==1.67.0",
    "pymongo==4.20.0",
    "pillow>=11.3.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build==0.10.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "safebite_agent"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.mypy]
files = ["safebite_agent", "app.py", "scripts/check_mongodb.py"]
check_untyped_defs = true
